<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#171225">
    <meta name="description" content="Test the Casablancas live-music Q&A agent.">
    <title>Ask Casablancas</title>
    <link rel="icon" href="assets/app-icon.png">
    <link rel="apple-touch-icon" href="assets/app-icon.png">
    <link rel="stylesheet" href="agent.css">
  </head>
  <body>
    <main>
      <header class="hero">
        <a class="back" href="index.html" aria-label="Back to map">← Map</a>
        <div id="avatar" aria-live="polite"></div>
        <p class="stamp">Live music intelligence</p>
        <h1>ASK<br><em>CASABLANCAS</em></h1>
        <p class="intro">Shows, artists, set history, venues, and merch—grounded in live sources.</p>
        <div class="grounding"><span aria-hidden="true"></span> Concert data powered by JamBase</div>
      </header>

      <section class="ask-card" aria-labelledby="ask-heading">
        <h2 id="ask-heading">What do you want to know?</h2>
        <div class="prompts" aria-label="Example questions">
          <button type="button">Who are the top artists?</button>
          <button type="button">Where is the nearest water or bathroom?</button>
          <button type="button">When is The Strokes' next show?</button>
        </div>

        <form id="ask-form">
          <label class="sr-only" for="input">Ask a music question</label>
          <textarea id="input" name="question" rows="3" maxlength="500" required placeholder="Ask about an artist, show, venue, or merch…"></textarea>
          <div class="form-actions">
            <button id="mic" type="button"><span aria-hidden="true">●</span> Talk</button>
            <button class="submit" type="submit">Ask the agent <span aria-hidden="true">↗</span></button>
          </div>
        </form>

        <div class="status-row">
          <p id="status" class="status" role="status" aria-live="polite">Ready for a question.</p>
          <label class="auto-voice"><input id="auto-voice" type="checkbox" checked> Auto voice</label>
        </div>
      </section>

      <article id="result" class="result" aria-labelledby="answer-heading" hidden>
        <div class="result-head">
          <p>Grounded answer</p>
          <button id="play-voice" type="button">▶ Play voice</button>
        </div>
        <h2 id="answer-heading">Answer</h2>
        <p id="answer"></p>
        <div id="source-block" hidden>
          <h3>Sources</h3>
          <ul id="sources"></ul>
        </div>
      </article>
    </main>

    <script>
      globalThis.CASABLANCAS_CONFIG = {
        apiBase: "https://healthy-goshawk-628.convex.site",
      };
    </script>
    <script type="module" src="src/agent-demo.js"></script>
  </body>
</html>
