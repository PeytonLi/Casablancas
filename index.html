<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#171225">
    <meta name="description" content="Walking directions across Outside Lands.">
    <title>Outside Lands Map</title>
    <link rel="icon" href="assets/app-icon.png">
    <link rel="apple-touch-icon" href="assets/app-icon.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main id="app" class="app">
      <section class="map-stage" aria-label="Outside Lands navigation map">
        <div id="map" class="map">
          <p class="map-loading" role="status">Loading festival map…</p>
        </div>
      </section>

      <header class="directions" aria-live="polite">
        <div id="direction-arrow" class="direction-arrow" aria-hidden="true">↑</div>
        <div>
          <p id="direction">Head northwest</p>
          <span id="destination">toward Lands End Stage</span>
        </div>
        <button id="tilt" type="button" aria-pressed="true">3D</button>
      </header>

      <section class="route-card" aria-label="Route details">
        <div class="route-summary">
          <div>
            <p class="eyebrow">Walking route</p>
            <h1 id="route-name">South Gate → Lands End</h1>
          </div>
          <strong id="walk-time">8 min</strong>
        </div>
        <nav class="destinations" aria-label="Choose destination">
          <button type="button" data-dest="lands-end">★<span>Stage</span></button>
          <button type="button" data-dest="water">●<span>Water</span></button>
          <button type="button" data-dest="restroom">◆<span>Restroom</span></button>
          <button type="button" data-dest="merch">✦<span>Merch</span></button>
          <button type="button" data-dest="exit">↗<span>Exit</span></button>
        </nav>
      </section>
    </main>
    <script>
      globalThis.CASABLANCAS_CONFIG ??= {
        apiBase: "https://healthy-goshawk-628.convex.site",
      };
    </script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
