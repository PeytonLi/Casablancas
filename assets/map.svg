<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 586" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">Outside Lands festival map</title>
  <desc id="map-desc">The festival map with an interactive walking route from South Gate to Lands End Stage and nearby amenities.</desc>
  <defs>
    <filter id="route-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pin-shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#081c32" flood-opacity=".7"/>
    </filter>
  </defs>
  <style>
    .map-pin { filter: url(#pin-shadow); pointer-events: none; }
    .map-pin circle { fill: #102b48; stroke: #fff; stroke-width: 2.5; transform-box: fill-box; transform-origin: center; transition: .2s ease; }
    .map-pin text { fill: #fff; font: 700 10px Arial, sans-serif; paint-order: stroke; stroke: #102b48; stroke-width: 3; stroke-linejoin: round; }
    .map-pin .pin-symbol { stroke: none; font-size: 11px; text-anchor: middle; }
    .map-pin .pin-label { opacity: 0; transition: opacity .2s ease; }
    .map-pin[data-type="stage"] circle { fill: #f04d5b; }
    .map-pin[data-type="water"] circle { fill: #087cbd; }
    .map-pin.is-highlighted circle { stroke: #ffe100; stroke-width: 5; transform: scale(1.25); }
    .map-pin.is-highlighted .pin-label { opacity: 1; }
    .active-route { fill: none; stroke: #ff2f92; stroke-linecap: round; stroke-linejoin: round; stroke-width: 6; filter: url(#route-glow); paint-order: stroke; }
    @media (prefers-reduced-motion: reduce) { .map-pin circle, .map-pin .pin-label { transition: none; } }
  </style>

  <rect width="1260" height="586" fill="#b2d34c"/>
  <image href="assets/outside-lands-map.png" width="1260" height="586" preserveAspectRatio="none" pointer-events="none"/>
  <g id="route-layer" aria-hidden="true"/>
  <g id="pin-layer"/>
</svg>
